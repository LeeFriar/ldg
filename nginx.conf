server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { access_log off; add_header Content-Type text/plain; return 200 'healthy\n'; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|ico|png|jpg|jpeg|webp|svg|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
